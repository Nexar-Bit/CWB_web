<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — CrowdWorks Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="auth">
    <div class="auth__box">
      <div class="auth__logo">
        <span class="auth__logo-cw">CW AutoBid</span>
        <span class="auth__logo-sub">CrowdWorks Bot · Web UI</span>
      </div>

      <div class="auth__card">
        <h1 class="auth__title">Sign in to your account</h1>

        {% if message %}
        <div class="banner banner--ok" role="status" style="margin-bottom:16px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M5 8l2.5 2.5L11 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {{ message }}
        </div>
        {% endif %}
        {% if error %}
        <div class="banner banner--err" role="alert" style="margin-bottom:16px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3.5M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="auth__fgrid">
          <input type="hidden" name="next" value="{{ next_url|e }}" />
          <div class="field">
            <label class="field__label" for="login-email">Email address</label>
            <input class="input" id="login-email" name="email" type="email"
              autocomplete="username" required autofocus placeholder="you@example.com" />
          </div>
          <div class="field">
            <label class="field__label" for="login-pass">Password</label>
            <input class="input" id="login-pass" name="password" type="password"
              autocomplete="current-password" required placeholder="••••••••" />
          </div>
          <button class="btn btn--primary auth__submit" type="submit">Sign in</button>
        </form>
      </div>

      <p class="auth__foot">
        No account?&nbsp;<a href="/register">Create one</a>
        {% if web_token_help %}
        &nbsp;·&nbsp;<a href="/auth/token">Instance token access</a>
        {% endif %}
      </p>
    </div>
  </div>
</body>
</html>
